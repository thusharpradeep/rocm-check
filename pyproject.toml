[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rocm-check"
dynamic = ["version"]
description = "Static scanner for CUDA-specific code that would break on AMD ROCm"
authors = [{ name = "Thushar Pradeep" }]
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["rocm", "amd", "cuda", "hip", "porting", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/thusharpradeep/rocm-check"
Repository = "https://github.com/thusharpradeep/rocm-check"
Issues = "https://github.com/thusharpradeep/rocm-check/issues"

[project.scripts]
rocm_check = "rocm_check.cli:main"
rocm-check = "rocm_check.cli:main"

[tool.setuptools.dynamic]
version = {attr = "rocm_check.__version__"}

[tool.setuptools.packages.find]
include = ["rocm_check*"]

[tool.setuptools.package-data]
rocm_check = [
    "rules.yaml",
    "templates/*.html",
    "static/*.css",
    "static/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
